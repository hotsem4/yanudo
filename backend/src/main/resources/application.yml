server:
  port: 8080
  # tailscale serve 가 앞단에서 HTTPS 를 종료하고 프록시한다.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml

spring:
  application:
    name: habit66
  datasource:
    url: jdbc:sqlite:${app.data-dir}/habit66.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      data-source-properties:
        journal_mode: WAL
        synchronous: NORMAL
        busy_timeout: 5000
        foreign_keys: true
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false

app:
  # DB, 오디오 캐시, VAPID 키가 모두 여기에 저장된다. 상대 경로는 실행 위치(프로젝트 루트) 기준.
  data-dir: ${APP_DATA_DIR:./data}
  timezone: Asia/Seoul
  # 이 시각 이전의 학습은 전날 기록으로 친다 (새벽 1시 복습 = 어제).
  day-rollover-hour: 3
  total-days: 66
  # 값을 넣으면 /api/v1/admin/** 호출에 X-Admin-Token 헤더가 필요하다.
  admin-token: ${APP_ADMIN_TOKEN:}
  morning-lock:
    start: "06:00"
    end: "09:30"
  tts:
    auto-generate: true
    # 공백으로 나눈 명령. edge-tts.exe 가 PATH 에 있으면 "edge-tts" 로 바꿔도 된다.
    command: ${APP_TTS_COMMAND:python -m edge_tts}
    rate: "-10%"
    voice-a: en-US-AndrewMultilingualNeural
    voice-b: en-US-AvaMultilingualNeural
    timeout-seconds: 60
  push:
    # 비워 두면 첫 실행 때 키를 만들어 data/vapid.json 에 저장한다.
    public-key: ${APP_VAPID_PUBLIC:}
    private-key: ${APP_VAPID_PRIVATE:}
    subject: ${APP_VAPID_SUBJECT:mailto:habit66@example.com}
  reminder:
    enabled: true
    cron: "0 0 22 * * *"
    # 모든 채널이 실패했으면 다시 시도한다 (하루 최대 max-attempts 회).
    retry-cron: "0 30 22 * * *"
    max-attempts: 3
    telegram:
      enabled: ${APP_TELEGRAM_ENABLED:false}
      bot-token: ${APP_TELEGRAM_BOT_TOKEN:}
      chat-id: ${APP_TELEGRAM_CHAT_ID:}
    discord:
      enabled: ${APP_DISCORD_ENABLED:false}
      webhook-url: ${APP_DISCORD_WEBHOOK_URL:}
  vocab:
    # 미리 만들지 않은 단어를 담았을 때 뜻·느낌·예문을 만드는 방법.
    #   claude-cli    : 로그인된 Claude Code 구독으로 claude -p 실행 (터미널에서 claude 로그인이 되어 있어야 한다)
    #   anthropic-api : API 키(환경 변수 ANTHROPIC_API_KEY)로 Claude Haiku 5.5 호출
    #   none          : 만들지 않는다. 사용자가 뜻을 직접 적는다
    generator: ${APP_VOCAB_GENERATOR:claude-cli}
    claude-command: ${APP_VOCAB_CLAUDE_COMMAND:claude}
    # claude -p --model 값
    claude-model: haiku
    timeout-seconds: 120

logging:
  level:
    org.hibernate.SQL: warn
