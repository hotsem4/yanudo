<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B 대본 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="mock.css">
<style>
  /*
   * 시안 B · 대본 흐름. 레슨이 A와 B의 대화라는 점을 살려 문장을 한 장씩이 아니라 대본으로 보여 준다.
   * 지금 줄만 크게 펼치고 앞뒤 줄은 한 줄로 접는다. 아직 안 나온 줄의 영어는 가려 둔다(암송 답이 보이지 않게).
   * 브리프에서 벗어난 것: 학습 카드 한 장 구조, 화면 40% 여백(대본이 카드 높이를 채움). 색·벤토 헤더·컨트롤 2줄·검은 독은 그대로.
   */
  main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 16px; max-width: 448px; min-height: 100dvh; margin: 0 auto; padding: 24px 20px 104px; }
  header { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .script { border-radius: 32px; padding: 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .ln { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 18px; }
  .ln .who { width: 24px; height: 24px; border-radius: 50%; flex: none; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: rgb(var(--tint)); color: rgb(var(--royal)); }
  .ln.b .who { background: rgb(var(--royal)); color: rgb(var(--surface)); }
  .ln p.t { font-size: 14.5px; font-weight: 500; line-height: 24px; color: rgb(var(--muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ln.next p.t { filter: blur(5px); user-select: none; }
  .ln.now { background: rgb(var(--tint) / .55); padding: 16px 14px 18px 10px; margin: 4px 0; }
  .ln.now > div { min-width: 0; flex: 1; }
  .ln.now .en { font-size: 25px; margin-top: -4px; }
  .ln.now .order span { background: rgb(var(--surface)); }
  .ln.now .meta { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: rgb(var(--muted-strong)); }
  .ln.now .mark { background: rgb(var(--surface)); }
  .ctrl { display: flex; flex-direction: column; gap: 10px; }
  .ctrl > div { display: flex; gap: 8px; align-items: center; }
  .ctrl .seg { flex: 1; }
  .dockrail { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; }
  .focus { display: none; }
  @media (max-width: 599px) { .script .ln:nth-child(-n+2) { display: none; } }
  @media (min-width: 600px) {
    main { grid-template-columns: minmax(280px, 5fr) minmax(0, 7fr); column-gap: 24px; max-width: 960px; height: 100dvh; padding: 24px 32px; }
    header { grid-area: 1 / 1; }
    .tabs { grid-area: 2 / 1; }
    .ctrl { grid-area: 4 / 1; }
    .script { grid-area: 3 / 1; border-radius: 24px; padding: 10px; justify-content: flex-start; overflow: hidden; align-self: start; }
    .script .ln.now { padding: 9px 10px; margin: 0; }
    .script .ln.now .en { font-size: 14.5px; font-weight: 600; line-height: 24px; margin: 0; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .script .ln.now .order, .script .ln.now .ko, .script .ln.now .meta { display: none; }
    .focus { display: flex; flex-direction: column; grid-area: 1 / 2 / 5 / 3; margin-bottom: 80px; border-radius: 32px; padding: 24px; }
    .focus .top { display: flex; align-items: center; justify-content: space-between; }
    .focus .top > span { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; color: rgb(var(--muted)); }
    .focus .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .focus .status { font-size: 12.5px; font-weight: 500; color: rgb(var(--muted)); }
    .dockrail { display: grid; grid-template-columns: minmax(280px, 5fr) minmax(0, 7fr); column-gap: 24px; max-width: 960px; margin: 0 auto; padding: 0 32px; }
    .dockrail > * { grid-column: 2; justify-self: center; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="characters.js"></script>
<script src="mock.js"></script>
<script>
const { ic, D, lines, cur, order, spk, dock, char } = M;
const L = lines[cur];
const row = (l, i) => i === cur
  ? `<div class="ln now ${l[0] === "B" ? "b" : ""}"><span class="who">${l[0]}</span><div><p class="en" lang="en" translate="no">${l[1]}</p><p class="order">${order(l[2])}</p><p class="ko">${l[3]}</p><div class="meta"><span class="num">15 / 20</span><span class="mark">${ic("check")}암기</span></div></div></div>`
  : `<div class="ln ${l[0] === "B" ? "b" : ""} ${i > cur ? "next" : ""}"><span class="who">${l[0]}</span><p class="t" lang="en" translate="no">${l[1]}</p></div>`;
document.getElementById("root").innerHTML = `
<main>
  <header>
    <button class="hero"><span class="row1"><span class="label">66일 습관</span></span>
      <span class="big num" style="margin-top:4px">Day ${D.current_day}<small> / 66</small></span>
      <span class="bar"><i style="transform:scaleX(${D.current_day / 66})"></i></span>
      <span class="foot"><span>${ic("flame")}연속 ${D.streak}일</span><span>${ic("snow")}${D.freezes}</span></span>
      <span class="badge">${char()}</span></button>
    <button class="card timer"><span class="row1"><span class="label">탭해서 집중 시작</span><span style="color:rgb(var(--royal));font-size:22px;display:flex">${ic("glass", 'stroke-width="1.75"')}</span></span>
      <span class="big num" style="margin-top:4px">25:00</span><span class="bar" style="margin-top:10px"><i style="transform:scaleX(0)"></i></span>
      <span class="foot">${ic("redo")}<span class="num">복습 14/20</span></span></button>
  </header>
  <div class="seg tab tabs"><button>오늘의 10문장</button><button class="on">누적 복습</button></div>
  <section class="card script">${lines.map(row).join("")}</section>
  <section class="card focus">
    <div class="top"><span>${spk(L[0])}<span class="num">15 / 20</span></span><span class="mark">${ic("check")}암기</span></div>
    <div class="body"><p class="en" lang="en" translate="no">${L[1]}</p><p class="order">${order(L[2])}</p><p class="ko">${L[3]}</p></div>
    <div class="status num">Day 1 문장</div>
  </section>
  <div class="ctrl">
    <div><div class="seg"><button class="on">전체</button><button>어순힌트</button><button>한글만</button></div><button class="chipbtn num">1.0x</button></div>
    <div><div class="seg"><button class="on">연속</button><button>끊어읽기</button><button>역할극</button></div><button class="chipbtn" style="font-size:18px">${ic("set")}</button></div>
  </div>
</main>
<div class="dockrail">${dock}</div>`;
</script>
</body>
</html>
