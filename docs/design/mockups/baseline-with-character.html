<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기준안 + 성장 캐릭터</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="mock.css">
<style>
  /* 기준안(현재 앱) 레이아웃 재현. 바뀐 곳은 히어로 카드의 캐릭터 배지와 66일 기록 시트 머리뿐이다. */
  main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 16px; max-width: 448px; min-height: 100dvh; margin: 0 auto; padding: 24px 20px 104px; }
  header { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stage { border-radius: 32px; padding: 24px; display: flex; flex-direction: column; min-height: 340px; }
  .stage .top { display: flex; align-items: center; justify-content: space-between; }
  .stage .top > span { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; color: rgb(var(--muted)); }
  .stage .body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 0; }
  .stage .status { height: 28px; display: flex; align-items: center; font-size: 12.5px; font-weight: 500; color: rgb(var(--muted)); }
  .ctrl { display: flex; flex-direction: column; gap: 10px; }
  .ctrl > div { display: flex; gap: 8px; align-items: center; }
  .ctrl .seg { flex: 1; }
  .dockrail { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; }
  .map { display: none; }
  @media (min-width: 600px) {
    main { grid-template-columns: minmax(280px, 5fr) minmax(0, 7fr); grid-template-rows: auto auto minmax(0, 1fr) auto; column-gap: 24px; max-width: 960px; height: 100dvh; padding: 24px 32px; }
    header { grid-area: 1 / 1; } .tabs { grid-area: 2 / 1; } .map { grid-area: 3 / 1; display: block; align-self: start; padding: 16px; } .ctrl { grid-area: 4 / 1; }
    .stage { grid-area: 1 / 2 / 5 / 3; margin-bottom: 80px; }
    .stage .rail { display: none; }
    .dockrail { display: grid; grid-template-columns: minmax(280px, 5fr) minmax(0, 7fr); column-gap: 24px; max-width: 960px; margin: 0 auto; padding: 0 32px; }
    .dockrail > * { grid-column: 2; justify-self: center; }
  }
  .map .head { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px; }
  .tiles { margin-top: 12px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .tiles b { height: 48px; border-radius: 16px; background: rgb(var(--canvas)); color: rgb(var(--muted-strong)); font-size: 13.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
  .tiles b.now { background: rgb(var(--royal)); color: rgb(var(--surface)); font-weight: 700; }
  .tiles b.done { background: rgb(var(--frost)); color: rgb(var(--ink)); font-weight: 600; }
  /* 66일 기록 시트 */
  .scrim { position: fixed; inset: 0; background: rgb(var(--ink) / .3); backdrop-filter: blur(2px); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 448px; margin: 0 auto; background: rgb(var(--surface)); border-radius: 32px 32px 0 0; box-shadow: var(--shadow-lift); padding: 12px 24px 24px; }
  @media (min-width: 600px) { .sheet { max-width: 512px; } }
  .grab { width: 40px; height: 6px; border-radius: 99px; background: rgb(var(--line)); margin: 0 auto 14px; }
  .sheet h2 { font-size: 19px; display: flex; align-items: center; justify-content: space-between; }
  .sheet h2 button { width: 36px; height: 36px; border-radius: 50%; background: rgb(var(--tint)); color: rgb(var(--royal)); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .grow { margin-top: 14px; display: flex; align-items: center; gap: 14px; background: rgb(var(--tint)); border-radius: 20px; padding: 10px 16px 10px 10px; }
  .grow .art { width: 88px; height: 88px; flex: none; }
  .grow b { font-size: 15px; } .grow p { margin-top: 3px; font-size: 13px; line-height: 1.5; color: rgb(var(--muted-strong)); word-break: keep-all; }
  .steps { margin-top: 12px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .steps div { text-align: center; font-size: 11.5px; font-weight: 500; color: rgb(var(--muted)); }
  .steps .art { width: 44px; height: 44px; margin: 0 auto 2px; }
  .steps .later .art { opacity: .28; }
  .steps .here { color: rgb(var(--royal)); font-weight: 700; }
  .steps .here .art { background: rgb(var(--tint)); border-radius: 50%; box-shadow: 0 0 0 2px rgb(var(--surface)), 0 0 0 4px rgb(var(--royal)); }
  .heat { margin-top: 16px; display: grid; grid-template-columns: repeat(11, 1fr); gap: 5px; }
  .heat i { aspect-ratio: 1; border-radius: 9px; background: rgb(var(--tint) / .7); font-style: normal; font-size: 10.5px; font-weight: 700; color: rgb(var(--royal)); display: flex; align-items: center; justify-content: center; }
  .heat i.ok { background: rgb(var(--royal)); color: rgb(var(--surface)); }
  .heat i.fr { background: rgb(var(--frost)); }
  .heat i.miss { background: rgb(var(--line)); }
  .heat i.today { box-shadow: 0 0 0 2px rgb(var(--surface)), 0 0 0 4px rgb(var(--royal)); background: rgb(var(--tint)); }
  .note { margin-top: 12px; font-size: 12.5px; color: rgb(var(--muted)); line-height: 1.6; word-break: keep-all; }
</style>
</head>
<body>
<div id="root"></div>
<script src="characters.js"></script>
<script src="mock.js"></script>
<script>
const { ic, D, lines, cur, order, spk, rail, dock, char, stage } = M;
const L = lines[cur];
const name = Char.names[M.kind];
const un = M.kind === "whale" ? "는" : "은", ga = M.kind === "whale" ? "가" : "이";
const stageNames = M.kind === "whale" ? ["물방울", "꼬리 돋음", "아기 고래", "첫 물줄기", "노래하는 고래", "완주"] : ["알", "금 간 알", "아기 새", "솜털 새", "날개 편 새", "완주"];
const heat = Array.from({ length: 66 }, (_, i) => {
  const d = i + 1, mile = Char.STAGE_DAYS.includes(d);
  const cls = d === D.current_day ? "today" : d > D.current_day ? "" : d === 9 ? "miss" : d === 13 ? "fr" : "ok";
  return `<i class="${cls} num">${mile ? d : ""}</i>`;
}).join("");
document.getElementById("root").innerHTML = `
<main>
  <header>
    <button class="hero"><span class="row1"><span class="label">66일 습관</span></span>
      <span class="big num" style="margin-top:4px">Day ${D.current_day}<small> / 66</small></span>
      <span class="bar"><i style="transform:scaleX(${D.current_day / 66})"></i></span>
      <span class="foot"><span>${ic("flame")}연속 ${D.streak}일</span><span>${ic("snow")}${D.freezes}</span></span>
      <span class="badge">${char()}</span></button>
    <button class="card timer"><span class="row1"><span class="label">탭해서 집중 시작</span><span style="color:rgb(var(--royal));font-size:22px;display:flex">${ic("glass", 'stroke-width="1.75"')}</span></span>
      <span class="big num" style="margin-top:4px">25:00</span><span class="bar" style="margin-top:10px"><i style="transform:scaleX(0)"></i></span>
      <span class="foot">${ic("redo")}<span class="num">복습 14/20</span></span></button>
  </header>
  <div class="seg tab tabs"><button>오늘의 10문장</button><button class="on">누적 복습</button></div>
  <section class="card map">
    <div class="head"><div><p class="label">암기한 문장</p><p class="big num">6<small style="color:rgb(var(--muted))"> / 20</small></p></div></div>
    <div class="tiles">${Array.from({ length: 20 }, (_, i) => `<b class="num ${i === 14 ? "now" : [0, 1, 2, 4, 7, 10].includes(i) ? "done" : ""}">${i + 1}</b>`).join("")}</div>
  </section>
  <section class="card stage">
    <div class="top"><span>${spk(L[0])}<span class="num">15 / 20</span></span><span class="mark">${ic("check")}암기</span></div>
    <div style="margin-top:16px">${rail(20, 14, [0, 1, 2, 4, 7, 10])}</div>
    <div class="body"><p class="en" lang="en" translate="no">${L[1]}</p><p class="order">${order(L[2])}</p><p class="ko">${L[3]}</p></div>
    <div class="status num">Day 1 문장</div>
  </section>
  <div class="ctrl">
    <div><div class="seg"><button class="on">전체</button><button>어순힌트</button><button>한글만</button></div><button class="chipbtn num">1.0x</button></div>
    <div><div class="seg"><button class="on">연속</button><button>끊어읽기</button><button>역할극</button></div><button class="chipbtn" style="font-size:18px">${ic("set")}</button></div>
  </div>
</main>
<div class="dockrail">${dock}</div>
${M.sheet ? `<div class="scrim"></div>
<section class="sheet">
  <div class="grab"></div>
  <h2>66일 기록<button aria-label="닫기">${ic("x")}</button></h2>
  <div class="grow"><div class="art">${char(stage, M.mood)}</div><div><b>${name}${un} 지금 ${stageNames[stage - 1]}예요</b><p>Day 42가 되면 ${stageNames[4]}로 자라요. 오늘 문장을 마치면 ${name}${ga} 반짝여요.</p></div></div>
  <div class="steps">${stageNames.map((n, i) => `<div class="${i + 1 === stage ? "here" : i + 1 > stage ? "later" : ""}"><div class="art">${char(i + 1, i === 5 ? "party" : "wait")}</div><span class="num">Day ${Char.STAGE_DAYS[i]}</span></div>`).join("")}</div>
  <div class="heat">${heat}</div>
  <p class="note">숫자가 적힌 칸이 ${name}${ga} 자라는 날이에요. 하루를 놓쳐도 ${name}${un} 작아지지 않아요.</p>
</section>` : ""}`;
</script>
</body>
</html>
